name: ct-viewer

x-backend: &backend
  build: ./backend
  image: ct-viewer-backend
  environment:
    DATABASE_URL: postgresql://ctviewer:${POSTGRES_PASSWORD:-ctviewer}@db:5432/ctviewer
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /data
  volumes:
    - ${DATA_DIR:-./data}:/data:ro  # the DICOM library, read-only
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ctviewer
      POSTGRES_USER: ctviewer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctviewer}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro  # applied once, on an empty volume
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ctviewer", "-d", "ctviewer"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]  # queued jobs survive a restart
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    restart: unless-stopped

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      start_period: 10s

  worker:
    <<: *backend
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "--worker-class", "app.worker.Worker"]
    deploy:
      replicas: 2  # two series are processed at the same time

  relay:
    <<: *backend
    command: ["python", "-m", "app.relay"]

  web:
    build: ./frontend
    image: ct-viewer-web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"  # localhost only: the app has no login
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
