name: ct-viewer

x-backend: &backend
  build: ./backend
  image: ct-viewer-backend
  environment:
    DATABASE_URL: postgresql://ctviewer:${POSTGRES_PASSWORD:-ctviewer}@db:5432/ctviewer
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /data
    S3_ENDPOINT: http://storage:9000
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ctviewer}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-ctviewer-local-storage}
    S3_BUCKET: ct-studies
    UPLOAD_ORIGINS: '["http://localhost:${WEB_PORT:-8080}", "http://localhost:5173"]'
  volumes:
    - ${DATA_DIR:-./data}:/data:ro  # the DICOM library, read-only
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
    storage-init: { condition: service_completed_successfully }
  restart: unless-stopped

services:
  storage:
    build: ./storage
    image: ct-viewer-storage
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ctviewer}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-ctviewer-local-storage}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:${WEB_PORT:-8080},http://localhost:5173
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9000}:9000"
    volumes:
      - objectdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  storage-init:
    <<: *backend
    command: ["python", "-m", "app.services.storage"]
    depends_on:
      storage: { condition: service_healthy }
    restart: "no"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ctviewer
      POSTGRES_USER: ctviewer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctviewer}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro  # applied once, on an empty volume
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ctviewer", "-d", "ctviewer"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]  # queued jobs survive a restart
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    restart: unless-stopped

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      start_period: 10s

  worker:
    <<: *backend
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "--worker-class", "app.worker.Worker"]
    deploy:
      replicas: 2  # two series are processed at the same time

  relay:
    <<: *backend
    command: ["python", "-m", "app.relay"]

  web:
    build: ./frontend
    image: ct-viewer-web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"  # localhost only: the app has no login
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  objectdata:
