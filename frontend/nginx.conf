# Serves the built UI and forwards /api to the FastAPI container (reached by its compose service name).
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 2m;  # CSV uploads (the API accepts up to 1 MB)

    # Look up `api` through Docker's DNS on each request (cached 10 s), not once at startup:
    # a recreated api container gets a new IP, and a fixed upstream would answer 502 until web restarts.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;  # no URI part: the request path is passed through unchanged
    }

    location / {
        try_files $uri /index.html;
    }
}
