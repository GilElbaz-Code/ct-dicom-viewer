# Serves the built UI and forwards /api to the FastAPI container (reached by its compose service name).
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 2m;  # CSV uploads (the API accepts up to 1 MB)

    location /api/ {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
