# Serves the built UI and forwards /api to the FastAPI container (reached by its compose service name).
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 2m;  # CSV uploads

    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 1800s;  # completion verifies up to 1 GiB before accepting the job
    }

    location / {
        try_files $uri /index.html;
    }
}
