server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Browser uploads are sent ~20 files per request; leave room for large slices.
    client_max_body_size 200m;

    # Docker's internal DNS. Resolving per request (via the variable) means nginx follows the
    # API container if it is recreated with a new IP, instead of caching the old one forever.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never trust identity from the browser: always overwrite it. In production, an auth_request to the
        # SSO proxy (oauth2-proxy) runs here and this line sends its verified user instead of "".
        proxy_set_header X-Forwarded-User "";
        proxy_request_buffering off;  # stream uploads straight to the API
        proxy_read_timeout 120s;
    }

    # Vite puts a content hash in asset file names, so they can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths fall back to index.html, which is never cached.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
